<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RL 算法的循环</title><link rel="stylesheet" href="anim.css">
<style>svg text.big{font-size:15px}svg text.cap{font-size:15px;font-weight:500}svg text.c{font-size:14px}</style></head>
<body><main>
<h1>第 6 章 · 强化学习算法的三个部分：跑样本 → 评估 → 改策略，转圈</h1>
<p class="sub">配套讲义：<a href="../lessons/06-policy.html">第 6 章 · 策略 policy π(a|s)：智能体的&quot;行事手册&quot;</a>。CS 285 第 4 讲的三框图。例子是编的：一个状态、两个动作，搜索平均 +2、等待平均 +1（都带噪声）。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 380"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row ctl"><label for="n">每圈跑几次</label><input type="range" id="n" min="2" max="40" step="1" value="10"><span id="nv">10</span></div>
<p class="note">看点：① 每帧走一个框：① 按现在的 π 掷骰子跑 n 次；② 用跑出来的奖励估两个动作各值多少；③ 把 π 往估得高的动作挪 0.1；② 转几圈以后 π(搜索) 接近 1；③ n 很小时估计会出错，π 偶尔往错的方向挪。后面各章只是把 ②、③ 换成不同的做法。</p>
</main>
<script src="anim.js"></script><script src="rl-common.js"></script>
<script>
const sv=$('sv');

let n=10,stage=0,loop=0,p=0.5,samples=[],est=[0,0],hist=[0.5],last='';
const BOX=[['① 生成样本','按 π 跑 n 次'],['② 评估','估每个动作值多少'],['③ 改进','π 往好的动作挪']];
function run(){samples=[];for(let i=0;i<n;i++){const a=rnd()<p?0:1;samples.push([a,(a?1:2)+gauss()])}}
function evalQ(){est=[0,1].map(a=>{const xs=samples.filter(s=>s[0]===a).map(s=>s[1]);return xs.length?xs.reduce((x,y)=>x+y,0)/xs.length:null})}
function improve(){const b=est[0]===null?1:est[1]===null?0:(est[0]>=est[1]?0:1);p=clamp(p+(b===0?0.1:-0.1),0,1);hist.push(p);last=b===0?'搜索':'等待'}
function draw(){clear(sv);
  txt(`第 ${loop+1} 圈 · π(搜索) = ${p.toFixed(2)}`,{x:340,y:24,'text-anchor':'middle',class:'cap'},sv);
  const pos=[[250,50],[430,170],[70,170]];
  pos.forEach(([x,y],i)=>{const on=i===stage;el('rect',{x,y,width:180,height:62,rx:10,fill:on?'var(--accent-bg)':'var(--bg)',stroke:on?'var(--accent)':'var(--line)','stroke-width':on?2.5:1},sv);
    txt(BOX[i][0],{x:x+90,y:y+26,'text-anchor':'middle',class:'big'},sv);txt(BOX[i][1],{x:x+90,y:y+47,'text-anchor':'middle',class:'m'},sv)});
  [['M430,90 L500,165'],['M430,205 L255,205'],['M160,165 L245,90']].forEach(([d])=>el('path',{d,fill:'none',stroke:'var(--muted)','stroke-width':1.5,'marker-end':'url(#ar)'},sv));
  const defs=el('defs',{},sv),m=el('marker',{id:'ar',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'},defs);el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--muted)'},m);
  let y=268;
  if(stage===0){const s=samples.map(([a,r])=>(a?'等':'搜')+fmt(r,1)).join('  ');txt('跑出来：'+(s.length>70?s.slice(0,70)+' …':s),{x:40,y},sv);
    txt(`搜索 ${samples.filter(s=>!s[0]).length} 次、等待 ${samples.filter(s=>s[0]).length} 次`,{x:40,y:y+24,class:'m'},sv)}
  if(stage===1){txt(`估计：搜索 ≈ ${est[0]===null?'没抽到':fmt(est[0],2)}，等待 ≈ ${est[1]===null?'没抽到':fmt(est[1],2)}`,{x:40,y},sv);
    txt('（真值是 2 和 1；跑得越少，估得越不准）',{x:40,y:y+24,class:'m'},sv)}
  if(stage===2){txt(`估得高的是"${last}"，π(搜索) 改成 ${p.toFixed(2)}`,{x:40,y},sv)}
  const gx=440,gy=270,gw=220,gh=80;el('line',{x1:gx,y1:gy+gh,x2:gx+gw,y2:gy+gh,stroke:'var(--line)'},sv);
  txt('π(搜索) 每圈的变化',{x:gx,y:gy-6,class:'m'},sv);let d='';
  hist.forEach((v,i)=>d+=(i?' L':'M')+(gx+i*gw/12).toFixed(1)+','+(gy+gh-v*gh).toFixed(1));el('path',{d,fill:'none',stroke:'var(--accent)','stroke-width':2},sv);
}
function reset(s){seed(s);stage=0;loop=0;p=0.5;hist=[0.5];run();draw()}
function next(){if(loop>=11&&stage===2)return false;stage=(stage+1)%3;if(stage===0){loop++;run()}if(stage===1)evalQ();if(stage===2)improve();draw();return true}
$('n').oninput=e=>{n=+e.target.value;$('nv').textContent=n;ANIM.stop();ANIM.reset(Date.now())};
setupPlayer({captureSeed:3,reset,next},1000);

</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
